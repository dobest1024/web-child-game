<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>骰子展开图工坊 · 3D空间立体几何</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="back-link" href="/" target="_top" aria-label="返回游戏大厅">
      <span>←</span> 大厅
    </a>
    <h1>骰子展开图工坊</h1>
    <button id="btn-levels">关卡 📋</button>
  </header>

  <div class="level-banner">
    <span id="level-info" style="font-weight:700">第 1 关</span>
    <button id="btn-restart" style="padding:4px 12px; font-size:0.85rem">🔄 重置</button>
  </div>

  <div class="question-box" id="question-text">
    在展开图中，找出与指定面相对的面！
  </div>

  <!-- Net Mode Container -->
  <div class="net-container" id="net-container"></div>

  <!-- Roll Mode Container -->
  <div class="roll-board" id="roll-board" style="display:none"></div>

  <div class="tip-banner" id="tip-text">提示：按相隔一个面或 Z 字形两端找出相对面！</div>

  <!-- Win Modal -->
  <dialog id="win-dialog">
    <h2 style="color:#2563eb">🎲 空间思维大突破！</h2>
    <p style="margin:14px 0; font-size:1.05rem; color:#475569">回答完全正确！你的 3D 几何想象力太棒啦！⭐⭐⭐</p>
    <button id="btn-next" class="primary" style="padding:10px 24px; font-weight:800">下一关 ➔</button>
  </dialog>

  <!-- Level Select Modal -->
  <dialog id="levels-dialog">
    <h3>选择展开图关卡</h3>
    <div class="level-grid" id="level-grid"></div>
    <button id="btn-close-levels">关闭</button>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
