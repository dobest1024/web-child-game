<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星球探险队</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
:root{
  /* Layout: one-screen app. A fixed top bar; each mode fills the screen above a live starfield; big tappable cards sized for small hands. */
  --space:#0a0d2b;
  --panel:#1c2363;
  --panel-2:#27317d;
  --line:#3a4596;
  --ink:#f5f2ff;
  --ink-dim:#b3b8e6;
  --sun:#ffc53d;
  --rocket:#ff6b57;
  --mint:#3fe0b5;
  --sky:#7cc0ff;
  --good:#46e08f;
  --bad:#ff7a8a;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --bar-h:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#sky,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#sky{z-index:0}
#fx{z-index:40;pointer-events:none}
#app{position:relative;z-index:1;height:100%}

/* top bar */
.bar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.bar > *{pointer-events:auto}
.bar .spacer{flex:1;pointer-events:none}
.bar-title{font-family:var(--display);font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;background:rgba(28,35,99,.88);border:2px solid var(--line);font-weight:900;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill .star{color:var(--sun)}
.pill.icon{width:44px;padding:0}
.pill svg{width:22px;height:22px;display:block}
@media (max-width:480px){.bar-title{display:none}.pill{padding:0 12px;font-size:16px}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;
  padding-top:calc(var(--bar-h) + 12px);padding-bottom:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* home */
#home{gap:14px;text-align:center}
#home > :first-child{margin-top:auto}
#home > :last-child{margin-bottom:auto}
.title{font-family:var(--display);font-weight:400;font-size:clamp(46px,12vw,88px);line-height:1;margin:0;letter-spacing:.04em;color:var(--sun);text-shadow:0 5px 0 #c4681a,0 12px 36px rgba(255,170,40,.35)}
.subtitle{margin:0;color:var(--ink-dim);font-size:clamp(16px,4.2vw,20px);text-wrap:balance}
#hero{width:min(220px,50vw,26vh);height:min(220px,50vw,26vh);max-width:100%;flex:none}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(660px,100%)}
.mode{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:24px;background:var(--c);color:#1a1440;box-shadow:0 6px 0 var(--d);transition:transform .1s,box-shadow .1s}
.mode:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--d)}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.mode canvas{flex:none;width:56px;height:56px}
.mode span{min-width:0}
.mode b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(20px,4.8vw,26px);line-height:1.15}
.mode small{display:block;font-size:13px;line-height:1.4;opacity:.78;margin-top:2px}
.m-explore{--c:#ffc53d;--d:#c4871a}
.m-quiz{--c:#3fe0b5;--d:#1f9e7d}
.m-order{--c:#7cc0ff;--d:#3f7fc2}
.m-book{--c:#ff9fc4;--d:#c8608a}
.m-arcade{--c:#ff8a6b;--d:#c4553a}
.m-cons{--c:#c9a8ff;--d:#8a64d1}
@media (min-width:760px){.modes{grid-template-columns:repeat(3,minmax(0,1fr));width:min(860px,100%)}}
.progress{color:var(--ink-dim);font-size:15px;margin:0}
.progress b{color:var(--ink)}
@media (max-width:440px){.mode{flex-direction:column;text-align:center;padding:12px 8px;gap:6px}}

/* explore */
#explore{padding:0}
#exCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
.ex-hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:max-content;max-width:max(190px,calc(100% - 190px));padding:10px 18px;border-radius:18px;background:rgba(20,26,78,.9);border:2px solid var(--line);text-align:center;font-size:15px;line-height:1.5;transition:opacity .8s;pointer-events:none}
.ex-hint kbd{font-family:var(--body);background:var(--panel-2);border-radius:6px;padding:1px 6px;border:1px solid var(--line)}

/* fact card */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;overflow-y:auto;background:rgba(5,6,25,.72);
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{position:relative;width:min(600px,100%);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:3px solid var(--line);border-radius:30px;padding:22px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:18px;align-items:center;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.card-art{display:grid;place-items:center}
.card-art canvas{width:210px;height:210px;max-width:100%;animation:float 3.2s ease-in-out infinite}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(255,197,61,.16);color:var(--sun);font-size:13px;font-weight:900;letter-spacing:.08em}
.card h2{font-family:var(--display);font-weight:400;font-size:46px;line-height:1.1;margin:6px 0 4px}
.hello{margin:0 0 12px;color:var(--mint);font-weight:700;line-height:1.5}
.facts{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:8px;text-align:left}
.facts li{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px 10px 36px;position:relative;line-height:1.55}
.facts li::before{content:"★";position:absolute;left:12px;top:10px;color:var(--sun)}
.new-badge{position:absolute;top:-16px;right:18px;background:var(--rocket);color:#fff;font-weight:900;padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 #b83d2d;transform:rotate(4deg);animation:wiggle 1.2s ease-in-out infinite}
@media (max-width:560px){.card{grid-template-columns:1fr;text-align:center;justify-items:center;padding:20px 16px}.card-art canvas{width:170px;height:170px}.card h2{font-size:40px}.actions{justify-content:center}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:18px;font-weight:900;font-size:18px;transition:transform .1s,box-shadow .1s}
.btn svg{width:22px;height:22px}
.btn.primary{background:var(--sun);color:#3a2200;box-shadow:0 5px 0 #c4871a}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #c4871a}
.btn.ghost{background:rgba(255,255,255,.08);border:2px solid var(--line)}
.btn.ghost:active{transform:translateY(2px)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* quiz */
.wrap{width:min(760px,100%);display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun);box-shadow:0 0 0 4px rgba(255,197,61,.25)}
.dots i.ok{background:var(--good)}
.dots i.no{background:var(--bad)}
.q-row{display:flex;gap:12px;align-items:center;justify-content:center}
.question{font-family:var(--display);font-weight:400;font-size:clamp(26px,6.4vw,42px);text-align:center;margin:0;text-wrap:balance;line-height:1.25;min-width:0}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.opt{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:clamp(17px,4.4vw,22px);font-weight:900;min-height:120px;box-shadow:0 6px 0 #0d1140;transition:transform .1s;line-height:1.3}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:disabled{cursor:default}
.opt canvas{width:72px;height:72px}
.opt.right{border-color:var(--good);background:#16493e;animation:pop .35s}
.opt.wrong{border-color:var(--bad);background:#4a1e36;animation:shake .4s}
.opt.dim{opacity:.45}
.feedback{background:rgba(255,255,255,.06);border-radius:20px;padding:14px 18px;text-align:center;line-height:1.6;font-size:17px}
.feedback b{display:block;font-family:var(--display);font-weight:400;font-size:28px}
.feedback.ok b{color:var(--good)}
.feedback.no b{color:var(--bad)}
.center{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .big{font-family:var(--display);font-size:clamp(56px,16vw,96px);line-height:1;color:var(--sun)}
.result p{margin:0;font-size:19px;line-height:1.6;text-wrap:balance}

/* order */
.lead{text-align:center;margin:0;font-size:clamp(17px,4.4vw,20px);line-height:1.5;text-wrap:balance}
.lane{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:2px dashed var(--line);border-radius:24px;padding:12px}
.lane-sun{flex:none;display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--sun);font-weight:900}
.lane-sun canvas{width:68px;height:68px}
.slots{flex:1;min-width:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.slot{min-height:84px;border-radius:14px;background:rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--ink-dim);font-weight:700;padding:4px 0}
.slot canvas{width:46px;height:46px}
.slot.filled{background:rgba(63,224,181,.14);color:var(--ink);animation:pop .35s}
.slot.next{outline:2px solid var(--sun);outline-offset:-2px}
@media (max-width:640px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}.lane-sun canvas{width:52px;height:52px}}
.tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(560px,100%);align-self:center}
.tray .opt{min-height:104px;font-size:17px}
.tray .opt canvas{width:58px;height:58px}
.msg{min-height:3.2em;text-align:center;font-size:18px;font-weight:700;line-height:1.6;display:grid;place-items:center}
.msg .tip{color:var(--sun)}

/* book */
.book{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:min(760px,100%)}
.sticker{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #0d1140;transition:transform .1s}
.sticker:hover{transform:translateY(-3px) rotate(-1deg)}
.sticker canvas{width:88px;height:88px;max-width:100%}
.sticker b{font-family:var(--display);font-weight:400;font-size:24px}
.sticker small{color:var(--ink-dim);font-size:13px;text-align:center}
.sticker.locked canvas{filter:brightness(0) opacity(.4)}
.sticker.locked b{color:var(--ink-dim)}

.toast{position:fixed;z-index:45;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);background:var(--sun);color:#3a2200;font-weight:900;padding:12px 20px;border-radius:18px;box-shadow:0 6px 0 #c4871a;text-align:center;line-height:1.5;animation:drop .4s cubic-bezier(.2,1.5,.4,1)}

/* explore missions */
.mission{position:absolute;z-index:2;top:calc(var(--bar-h) + 2px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;padding:8px 10px 8px 12px;border-radius:20px;background:rgba(20,26,78,.92);border:2px solid var(--line);font-weight:900;font-size:16px;line-height:1.4;text-align:center}
.mission .pill{height:36px;font-size:15px;padding:0 14px;background:var(--sun);color:#3a2200;border-color:#c4871a}
.mission .m-hint{flex-basis:100%;color:var(--sun);font-size:14px}

/* level pickers and tabs */
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%}
.levels.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.lvl{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 #0d1140;transition:transform .1s;min-width:0}
.lvl:hover:not(:disabled){transform:translateY(-3px)}
.lvl canvas{width:56px;height:56px}
.lvl b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2}
.lvl small{color:var(--ink-dim);font-size:13px;line-height:1.35;text-align:center}
.lvl .rate{color:var(--sun);letter-spacing:2px;font-size:15px;font-weight:900}
.lvl:disabled{opacity:.45;cursor:not-allowed}
.lvl.cur{border-color:var(--sun);box-shadow:0 6px 0 #0d1140,0 0 0 4px rgba(255,197,61,.25)}
@media (max-width:520px){.levels{gap:8px}.lvl{padding:10px 2px}.lvl b{font-size:16px}.lvl canvas{width:44px;height:44px}.lvl .rate{letter-spacing:0;font-size:13px}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tab{min-height:44px;padding:0 16px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:900;font-size:16px}
.tab.on{background:var(--sun);color:#3a2200;border-color:#c4871a}
.tab:disabled{opacity:.4;cursor:not-allowed}

/* arcade */
#arcCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.overlay{position:absolute;inset:0;z-index:3;display:flex;overflow-y:auto;background:rgba(5,6,25,.5);
  padding-block:calc(var(--bar-h) + 12px) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{width:min(520px,100%);margin:auto;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:3px solid var(--line);border-radius:30px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
.panel h2{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;margin:0}
.panel p{margin:0;line-height:1.6;font-size:17px;text-wrap:balance}
.panel .fact{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px;color:var(--mint);font-weight:700}
.rating{font-size:52px;letter-spacing:6px;color:var(--sun);line-height:1}
.rating .off{color:var(--line)}

/* constellations */
#consCanvas{width:100%;height:min(56vh,520px);min-height:280px;border-radius:24px;background:#060821;border:2px solid var(--line);display:block;touch-action:none;cursor:pointer}

/* badges */
.section-title{font-family:var(--display);font-weight:400;font-size:28px;margin:10px 0 0;text-align:center}
.badges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:min(860px,100%)}
.wonders{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;width:min(860px,100%)}
.wonders .sticker{padding:10px 4px}
.wonders .sticker canvas{width:64px;height:64px}
.wonders .sticker b{font-size:17px;text-align:center;line-height:1.25}

/* cosmos journey */
#cosCanvas{width:100%;height:min(62vh,600px);min-height:300px;border-radius:24px;background:#04051a;border:2px solid var(--line);display:block;touch-action:manipulation;cursor:pointer}
.cos-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.cos-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.mode.wide{grid-column:1/-1;justify-content:center}
@media (max-width:600px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.badge{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;background:radial-gradient(circle at 35% 30%,#fff3b8,var(--sun) 55%,#c4871a);color:#5a3500;box-shadow:0 4px 0 #8a5a10}
.badge b{font-size:16px}
.badge small{color:var(--ink-dim);font-size:13px;line-height:1.4}
.badge.locked .medal{background:var(--line);color:var(--ink-dim);box-shadow:none}
.badge.locked b{color:var(--ink-dim)}

@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes wiggle{50%{transform:rotate(-4deg) scale(1.06)}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<header class="bar">
  <button class="pill" id="backBtn" hidden aria-label="回到首页">← 回家</button>
  <div class="bar-title" id="barTitle"></div>
  <div class="spacer"></div>
  <div class="pill" id="stickerPill" hidden>贴纸 <span id="stickerCount">0</span>/9</div>
  <div class="pill" title="我的星星"><span class="star">★</span><span id="starCount">0</span></div>
  <button class="pill icon" id="soundBtn" aria-label="声音开关"></button>
</header>

<div id="app">
  <section class="screen" id="home">
    <h1 class="title">星球探险队</h1>
    <p class="subtitle">开着小火箭，去太阳系的每颗星球打个招呼！</p>
    <canvas id="hero" aria-hidden="true"></canvas>
    <div class="modes">
      <button class="mode m-cons wide" data-go="cosmos"><canvas data-icon="cosmos"></canvas><span><b>宇宙大旅行</b><small id="pCosmos"></small></span></button>
      <button class="mode m-explore" data-go="explore"><canvas data-icon="rocket"></canvas><span><b>开火箭探险</b><small id="pExplore"></small></span></button>
      <button class="mode m-arcade" data-go="arcade"><canvas data-icon="moon"></canvas><span><b>太空大冒险</b><small id="pArcade"></small></span></button>
      <button class="mode m-quiz" data-go="quiz"><canvas data-icon="jupiter"></canvas><span><b>星球问答</b><small id="pQuiz"></small></span></button>
      <button class="mode m-order" data-go="order"><canvas data-icon="saturn"></canvas><span><b>行星排排队</b><small id="pOrder"></small></span></button>
      <button class="mode m-cons" data-go="cons"><canvas data-icon="cons"></canvas><span><b>星座连连看</b><small id="pCons"></small></span></button>
      <button class="mode m-book" data-go="book"><canvas data-icon="earth"></canvas><span><b>图鉴和勋章</b><small id="pBook"></small></span></button>
    </div>
    <p class="progress" id="homeProgress"></p>
  </section>

  <section class="screen" id="explore" hidden>

const SAVE_KEY = 'planet-explorers-v1';
const save = {stars:0, stickers:[], muted:false, mission:0, arc:{}, quizBest:[0,0,0,0], orderDone:{}, cons:[], wonders:[], badges:[]};
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) Object.assign(save, JSON.parse(raw)); } catch (e) {}
for (const k of ['stickers','cons','wonders','badges']) if (!Array.isArray(save[k])) save[k] = [];
if (!Array.isArray(save.quizBest)) save.quizBest = [0,0,0,0];
for (const k of ['arc','orderDone']) if (!save[k] || typeof save[k] !== 'object') save[k] = {};
save.mission = Math.max(0, Number(save.mission) || 0);
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
function persist() { writeSave(); checkBadges(); }
function checkBadges() {
  for (const b of BADGES) {
    if (save.badges.includes(b.id) || !b.ok()) continue;
    save.badges.push(b.id); writeSave();
    toast(`获得勋章「${b.name}」！`, 3200);
  }
}

}

/* ---------- 声音 ---------- */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type = 'sine', vol = .14, when = 0, slideTo = 0) {
  if (save.muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}

/* ---------- 画星球 ---------- */
const BASE = {
  sun:['#fff6b8','#ff9a1f'], mercury:['#bdb8b1','#7a756f'], venus:['#f6dc9c','#d39a52'],
  earth:['#56adff','#1d5cc4'], mars:['#f08550','#b23e1c'], jupiter:['#ecc89c','#c4895a'],
  saturn:['#f5e3b4','#d2b071'], uranus:['#b0f3f4','#5cc3d2'], neptune:['#6a8fff','#2742b3'],
  moon:['#e2e2e8','#9a9aa8'], pluto:['#ecd9c2','#a07e62']

function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const CRATERS = {};
function craters(id) {
  if (CRATERS[id]) return CRATERS[id];
  const R = rng(id.charCodeAt(0) * 9973 + id.length * 131);
  return CRATERS[id] = Array.from({length:8}, () => ({x:R() * 1.6 - .8, y:R() * 1.6 - .8, r:.08 + R() * .14}));
}
const LAND = [{x:-.55,y:-.3,rx:.32,ry:.24},{x:-.35,y:.3,rx:.18,ry:.32},{x:.4,y:-.25,rx:.38,ry:.2},{x:.55,y:.35,rx:.2,ry:.16},{x:1.0,y:.05,rx:.26,ry:.3}];
const wrap = (v, p) => ((v % p) + p) % p;

function ring(ctx, x, y, r, front, cols, tilt, thick) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  ctx.beginPath();
  if (front) ctx.rect(-r * 3, 0, r * 6, r * 3); else ctx.rect(-r * 3, -r * 3, r * 6, r * 3);
  ctx.clip();
  cols.forEach((c, i) => {
    const rr = r * (1.38 + i * .2);
    ctx.beginPath(); ctx.ellipse(0, 0, rr, rr * .3, 0, 0, TAU);
    ctx.lineWidth = r * thick; ctx.strokeStyle = c; ctx.stroke();

}
const SATURN_RING = ['rgba(233,214,160,.95)','rgba(196,168,112,.9)','rgba(240,226,186,.75)'];
const URANUS_RING = ['rgba(210,245,250,.45)'];

function drawPlanet(ctx, id, x, y, r, o = {}) {
  const rot = o.rot || 0;
  ctx.save();
  if (id === 'sun') {
    const g = ctx.createRadialGradient(x, y, r * .7, x, y, r * 1.9);
    g.addColorStop(0, 'rgba(255,190,60,.55)'); g.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.9, 0, TAU); ctx.fill();
  }
  if (id === 'saturn') ring(ctx, x, y, r, false, SATURN_RING, -.35, .2);
  if (id === 'uranus') ring(ctx, x, y, r, false, URANUS_RING, 1.32, .06);

  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  const B = BASE[id];
  const bg = ctx.createLinearGradient(x, y - r, x, y + r);
  bg.addColorStop(0, B[0]); bg.addColorStop(1, B[1]);
  ctx.fillStyle = bg; ctx.fillRect(x - r, y - r, r * 2, r * 2);

  if (id === 'mercury' || id === 'moon') {
    for (const c of craters(id)) {
      const cx = x + c.x * r, cy = y + c.y * r;
      ctx.fillStyle = 'rgba(40,36,50,.22)'; ctx.beginPath(); ctx.arc(cx, cy, c.r * r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(cx - c.r * r * .25, cy - c.r * r * .25, c.r * r * .55, 0, TAU); ctx.fill();
    }
  } else if (id === 'venus') {
    ctx.strokeStyle = 'rgba(255,248,220,.5)'; ctx.lineWidth = r * .1; ctx.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const y0 = y + (i - 2) * r * .4, s = Math.sin(rot * 3 + i) * r * .15;
      ctx.beginPath(); ctx.moveTo(x - r, y0); ctx.bezierCurveTo(x - r * .3, y0 - r * .22 + s, x + r * .3, y0 + r * .22 - s, x + r, y0); ctx.stroke();
    }
  } else if (id === 'earth') {
    ctx.fillStyle = '#4fc275';
    for (const b of LAND) {
      const bx = wrap(b.x + 1.3 + rot, 2.6) - 1.3;
      ctx.beginPath(); ctx.ellipse(x + bx * r, y + b.y * r, b.rx * r, b.ry * r, .3, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.ellipse(x, y - r * .98, r * .55, r * .16, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, y + r * .98, r * .5, r * .14, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = r * .08; ctx.lineCap = 'round';
    const cx = wrap(rot * 1.4 + 1, 2.6) - 1.3;
    ctx.beginPath(); ctx.moveTo(x + (cx - .3) * r, y + r * .55); ctx.lineTo(x + (cx + .25) * r, y + r * .5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + (cx - .9) * r, y - r * .55); ctx.lineTo(x + (cx - .45) * r, y - r * .6); ctx.stroke();
  } else if (id === 'mars') {
    ctx.fillStyle = 'rgba(120,32,10,.35)';
    for (const c of craters('mars')) { ctx.beginPath(); ctx.ellipse(x + c.x * r, y + c.y * r, c.r * r * 1.8, c.r * r, .4, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,250,245,.92)';
    ctx.beginPath(); ctx.ellipse(x, y - r * .97, r * .42, r * .16, 0, 0, TAU); ctx.fill();
  } else if (id === 'jupiter' || id === 'saturn') {
    const bands = id === 'jupiter'
      ? [[-1,'#c98b55'],[-.68,'#f2d6ab'],[-.44,'#b8733f'],[-.2,'#f5dfba'],[.08,'#c98b55'],[.32,'#f0d0a2'],[.58,'#b06a38'],[.82,'#ead0a4']]
      : [[-1,'#d8bb7c'],[-.6,'#f6e7bf'],[-.3,'#e4cd95'],[.05,'#f7eac6'],[.4,'#dcc184'],[.7,'#efdcae']];
    bands.forEach(([yy, c], i) => {
      const next = i + 1 < bands.length ? bands[i + 1][0] : 1.05;
      ctx.fillStyle = c; ctx.fillRect(x - r, y + yy * r, r * 2, (next - yy) * r + 1);
    });
    if (id === 'jupiter') {
      ctx.fillStyle = '#c9472b';
      ctx.beginPath(); ctx.ellipse(x + r * .32, y + r * .45, r * .24, r * .13, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,170,.6)';
      ctx.beginPath(); ctx.ellipse(x + r * .28, y + r * .42, r * .1, r * .05, 0, 0, TAU); ctx.fill();

  } else if (id === 'uranus') {

    ctx.beginPath(); ctx.ellipse(x - r * .3, y + r * .35, r * .22, r * .12, -.2, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = r * .07; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - r * .1, y - r * .45); ctx.lineTo(x + r * .45, y - r * .5); ctx.stroke();
  } else if (id === 'pluto') {
    ctx.fillStyle = 'rgba(255,250,240,.85)';
    const hx = x + r * .25, hy = y + r * .42, hs = r * .3;
    ctx.beginPath(); ctx.moveTo(hx, hy + hs * .6);
    ctx.bezierCurveTo(hx - hs * 1.3, hy - hs * .2, hx - hs * .8, hy - hs * 1.2, hx, hy - hs * .5);
    ctx.bezierCurveTo(hx + hs * .8, hy - hs * 1.2, hx + hs * 1.3, hy - hs * .2, hx, hy + hs * .6); ctx.fill();
    ctx.fillStyle = 'rgba(90,50,30,.25)';
    for (const c of craters('pluto')) { ctx.beginPath(); ctx.arc(x + c.x * r, y + c.y * r * .6 - r * .3, c.r * r * .7, 0, TAU); ctx.fill(); }
  } else if (id === 'sun') {
    ctx.fillStyle = 'rgba(255,255,210,.25)';
    for (const c of craters('sun')) { ctx.beginPath(); ctx.arc(x + c.x * r, y + c.y * r, c.r * r * 1.2, 0, TAU); ctx.fill(); }

    sg.addColorStop(0, 'rgba(255,255,255,.28)'); sg.addColorStop(.45, 'rgba(255,255,255,0)'); sg.addColorStop(1, 'rgba(5,5,35,.55)');

  if (id === 'uranus') ring(ctx, x, y, r, true, URANUS_RING, 1.32, .06);

  ctx.restore();
}

function drawFace(ctx, x, y, r, blink) {
  const ex = r * .32, ey = y - r * .02, er = Math.max(1.6, r * .13), lw = Math.max(1.4, r * .055);
  ctx.lineCap = 'round';

      ctx.beginPath(); ctx.moveTo(cx - er, ey); ctx.quadraticCurveTo(cx, ey + er * .7, cx + er, ey); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(cx, ey, er, er * 1.15, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#1b1640'; ctx.beginPath(); ctx.arc(cx + er * .12, ey + er * .2, er * .62, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + er * .35, ey - er * .05, er * .22, 0, TAU); ctx.fill();
    }

  for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * .55, y + r * .2, r * .1, 0, TAU); ctx.fill(); }

  ctx.beginPath(); ctx.arc(x, y + r * .12, r * .18, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
}

function drawRocket(ctx, x, y, a, s = 1, flame = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  if (flame > 0) {
    const f = 10 + Math.random() * 9 * flame;
    const g = ctx.createLinearGradient(-12, 0, -14 - f, 0);
    g.addColorStop(0, '#fff2a8'); g.addColorStop(.5, '#ffb03a'); g.addColorStop(1, 'rgba(255,90,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-11, -6); ctx.quadraticCurveTo(-14 - f, 0, -11, 6); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#ff6b57';
  for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-4, 7 * k); ctx.lineTo(-15, 15 * k); ctx.lineTo(-13, 4 * k); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = '#f4f1ff';
  ctx.beginPath(); ctx.moveTo(20, 0); ctx.quadraticCurveTo(12, -10, -12, -8); ctx.lineTo(-12, 8); ctx.quadraticCurveTo(12, 10, 20, 0); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#ff6b57'; ctx.fillRect(10, -12, 12, 24);
  ctx.fillStyle = 'rgba(30,20,80,.18)'; ctx.fillRect(-12, 2, 34, 10);
  ctx.restore();
  ctx.fillStyle = '#2b3a8f'; ctx.beginPath(); ctx.arc(2, 0, 4.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#9fb1ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.arc(.8, -1.6, 1.5, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawStar(c, x, y, R, rot) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.fillStyle = 'rgba(255,214,80,.18)'; c.beginPath(); c.arc(0, 0, R * 1.7, 0, TAU); c.fill();
  c.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? R * .45 : R, a = i * Math.PI / 5 - Math.PI / 2; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = '#ffd54a'; c.fill();
  c.restore();
}

function drawRock(c, x, y, size, rot, verts) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.beginPath();
  verts.forEach((v, i) => { const px = Math.cos(v.a) * v.r * size, py = Math.sin(v.a) * v.r * size; i ? c.lineTo(px, py) : c.moveTo(px, py); });
  c.closePath(); c.fillStyle = '#8c7b6a'; c.fill();
  c.lineWidth = 2; c.strokeStyle = '#5f5045'; c.stroke();

function drawHeart(c, x, y, s, full) {
  c.save(); c.translate(x, y); c.scale(s / 20, s / 20);
  c.beginPath(); c.moveTo(0, 8); c.bezierCurveTo(-14, -2, -10, -14, 0, -6); c.bezierCurveTo(10, -14, 14, -2, 0, 8); c.closePath();
  c.fillStyle = full ? '#ff6b8a' : 'rgba(255,255,255,.15)'; c.fill();
  c.lineWidth = 2; c.strokeStyle = full ? '#ffd0dc' : 'rgba(255,255,255,.3)'; c.stroke();
  c.restore();

/* ---------- 宇宙奇观的画法 ---------- */
function glow(c, x, y, r, col, a = 1) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function drawStarBall(c, x, y, r, inner, outer, halo, face) {
  glow(c, x, y, r * 2.6, halo, .55);
  const b = c.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
  b.addColorStop(0, inner); b.addColorStop(1, outer);
  c.fillStyle = b; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();

function spikes(c, x, y, len, col) {
  c.save(); c.strokeStyle = col; c.lineCap = 'round';
  for (let k = 0; k < 4; k++) {
    const a = k * Math.PI / 4, l = k % 2 ? len * .55 : len;
    c.lineWidth = k % 2 ? 1.5 : 2.5;
    c.beginPath(); c.moveTo(x - Math.cos(a) * l, y - Math.sin(a) * l); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();

  c.restore();

const PTS_CACHE = {};
function cached(key, make) { return PTS_CACHE[key] || (PTS_CACHE[key] = make()); }
function spiralPts(seed, arms) {
  return cached('sp' + seed + '_' + arms, () => {
    const R = rng(seed), pts = [];
    for (let i = 0; i < 900; i++) {
      const f = Math.pow(R(), .8);
      pts.push({a:f * 3.4 * Math.PI + (i % arms) * TAU / arms + (R() - .5) * .5, r:.1 + f * .9 + (R() - .5) * .06, s:R()});
    }
    return pts;

}
function drawSpiral(c, x, y, R, o = {}) {
  const col = o.color || '200,215,255', core = o.core || '255,230,170';
  c.save(); c.translate(x, y); c.rotate(o.angle || 0); c.scale(1, o.squash ?? 1);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, R);
  g.addColorStop(0, `rgba(${core},.95)`); g.addColorStop(.16, `rgba(${core},.45)`); g.addColorStop(.6, `rgba(${col},.1)`); g.addColorStop(1, `rgba(${col},0)`);

  c.globalCompositeOperation = 'lighter';
  const ds = Math.max(.6, R / 90), rot = o.rot || 0;
  for (const p of spiralPts(o.seed || 1, o.arms || 2)) {
    const a = p.a + rot, sz = ds * (1 + p.s);
    c.fillStyle = `rgba(${p.s > .86 ? '255,170,210' : col},${.25 + p.s * .5})`;
    c.fillRect(Math.cos(a) * p.r * R, Math.sin(a) * p.r * R, sz, sz);
  }
  c.restore();
}
function drawBlob(c, x, y, R, seed, col, n = 260) {
  const pts = cached('bl' + seed, () => { const r = rng(seed); return Array.from({length:n}, () => { const a = r() * TAU, d = Math.pow(r(), .7); return {x:Math.cos(a) * d * (1 + r() * .4), y:Math.sin(a) * d * .55 + (r() - .5) * .2, s:r()}; }); });
  glow(c, x, y, R, col, .3);
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const p of pts) { c.fillStyle = `rgba(${col},${.3 + p.s * .5})`; const s = Math.max(.8, R / 60) * (1 + p.s); c.fillRect(x + p.x * R, y + p.y * R, s, s); }
  c.restore();
}
function drawGalaxyCloud(c, x, y, R, seed, n) {
  const pts = cached('gc' + seed, () => { const r = rng(seed); return Array.from({length:n}, () => { const a = r() * TAU, d = Math.pow(r(), 1.6); return {x:Math.cos(a) * d, y:Math.sin(a) * d, s:r(), t:r() * 3}; }); });
  glow(c, x, y, R, '255,220,160', .22);
  for (const p of pts) {
    const px = x + p.x * R, py = y + p.y * R, s = Math.max(1.2, R / 40) * (.6 + p.s);
    glow(c, px, py, s * 2.4, p.s > .5 ? '255,235,200' : '190,210,255', .8);
    c.save(); c.translate(px, py); c.rotate(p.t); c.fillStyle = 'rgba(255,250,240,.9)'; c.beginPath(); c.ellipse(0, 0, s, s * .5, 0, 0, TAU); c.fill(); c.restore();
  }

function bhDisk(c, x, y, r, front, t) {
  c.save(); c.translate(x, y); c.beginPath();
  if (front) c.rect(-r * 5, 0, r * 10, r * 5); else c.rect(-r * 5, -r * 5, r * 10, r * 5);
  c.clip();
  for (let i = 0; i < 5; i++) {
    const rr = r * (1.35 + i * .3);
    c.beginPath(); c.ellipse(0, 0, rr, rr * .28, 0, 0, TAU);
    c.lineWidth = r * .3; c.strokeStyle = `rgba(255,${150 + i * 18},${60 + i * 25},${.9 - i * .15})`; c.stroke();
  }
  for (let k = 0; k < 8; k++) {
    const a = t * 1.6 + k * TAU / 8, rr = r * (1.5 + (k % 3) * .3), px = Math.cos(a) * rr, py = Math.sin(a) * rr * .28;

function drawBlackHole(c, x, y, r, t) {

  c.fillStyle = '#000'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();

}
function webPts(seed, n) {
  return cached('web' + seed, () => {
    const r = rng(seed), nodes = Array.from({length:n}, () => { const a = r() * TAU, d = Math.sqrt(r()); return {x:Math.cos(a) * d, y:Math.sin(a) * d, s:r()}; });
    const edges = [];

      nodes.map((q, j) => [j, Math.hypot(p.x - q.x, p.y - q.y)]).filter(e => e[0] !== i).sort((a, b) => a[1] - b[1]).slice(0, 3)
        .forEach(([j]) => { if (i < j) edges.push([i, j]); });

function drawWeb(c, x, y, R, seed, n = 46) {
  const {nodes, edges} = webPts(seed, n);
  c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
  for (const [lw, a] of [[R / 22, .12], [R / 90 + .6, .55]]) {

}
function drawFlow(c, x, y, R, ax, ay, t) {
  c.save(); c.lineCap = 'round';
  for (let k = 0; k < 28; k++) {
    const a = k * TAU / 28, sx = x + Math.cos(a) * R, sy = y + Math.sin(a) * R * .8;
    const mx = (sx + ax) / 2 + Math.cos(a + 1.3) * R * .25, my = (sy + ay) / 2 + Math.sin(a + 1.3) * R * .25;
    c.strokeStyle = 'rgba(120,200,255,.32)'; c.lineWidth = Math.max(1, R / 160);
    c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(mx, my, ax, ay); c.stroke();

    glow(c, px, py, Math.max(2.5, R / 50), '200,235,255', .95);
  }
  glow(c, ax, ay, R * .3, '255,220,170', .7);
  c.restore();
}

/* 一张奇观卡片：在 s×s 的方框里画 art */
function drawWonder(c, art, x, y, s, t) {
  c.save();
  switch (art) {
    case 'solar': {
      drawPlanet(c, 'sun', x, y, s * .12, {face:true});
      ['mercury','venus','earth','mars'].forEach((id, i) => {
        const rr = s * (.2 + i * .07), a = t * (.5 - i * .08) + i * 1.7;
        c.strokeStyle = 'rgba(170,185,255,.3)'; c.lineWidth = 1; c.beginPath(); c.arc(x, y, rr, 0, TAU); c.stroke();
        drawPlanet(c, id, x + Math.cos(a) * rr, y + Math.sin(a) * rr, s * (.025 + i * .004));
      });
      break;
    }
    case 'comet': {
      const hx = x + s * .18, hy = y - s * .18, dx = -.7, dy = .7, px = -dy, py = dx;
      for (const [len, wd, col, bend] of [[.62, .12, '255,220,150', .12], [.55, .06, '140,200,255', 0]]) {
        const ex = hx + dx * s * len + px * s * bend, ey = hy + dy * s * len + py * s * bend;
        const g = c.createLinearGradient(hx, hy, ex, ey);
        g.addColorStop(0, `rgba(${col},.85)`); g.addColorStop(1, `rgba(${col},0)`);
        c.fillStyle = g; c.beginPath();
        c.moveTo(hx + px * s * .05, hy + py * s * .05); c.lineTo(ex + px * s * wd, ey + py * s * wd);
        c.lineTo(ex - px * s * wd * .3, ey - py * s * wd * .3); c.lineTo(hx - px * s * .05, hy - py * s * .05); c.closePath(); c.fill();
      }
      drawStarBall(c, hx, hy, s * .09, '#ffffff', '#9fd4ff', '170,220,255', true);
      break;
    }
    case 'pluto':
      drawPlanet(c, 'pluto', x, y, s * .36, {face:true});
      break;
    case 'reddwarf':
      drawStarBall(c, x, y, s * .26, '#ffb08a', '#d9412b', '255,90,60', true);
      break;
    case 'bluestar':
      spikes(c, x, y, s * .46, 'rgba(210,230,255,.7)');
      drawStarBall(c, x, y, s * .24, '#ffffff', '#9cc4ff', '150,190,255', true);
      break;
    case 'nebula': {
      const R = rng(42);
      c.globalCompositeOperation = 'lighter';
      const cols = ['255,90,170', '160,90,255', '60,200,220', '255,150,90'];
      for (let i = 0; i < 9; i++) glow(c, x + (R() - .5) * s * .55, y + (R() - .5) * s * .5, s * (.16 + R() * .2), cols[i % 4], .45 + R() * .25);
      for (let i = 0; i < 4; i++) glow(c, x + (R() - .5) * s * .3, y + (R() - .5) * s * .3, s * .03, '255,255,255', 1);
      break;
    }
    case 'supernova': {
      const R = rng(1054);
      glow(c, x, y, s * .45, '255,120,60', .35);
      c.lineCap = 'round';
      for (let i = 0; i < 46; i++) {
        const a = R() * TAU, r1 = s * (.08 + R() * .1), r2 = s * (.24 + R() * .2);
        c.strokeStyle = R() < .5 ? 'rgba(255,110,70,.7)' : 'rgba(255,200,120,.65)'; c.lineWidth = 1 + R() * 2.5;
        c.beginPath(); c.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); c.lineTo(x + Math.cos(a + .1) * r2, y + Math.sin(a + .1) * r2); c.stroke();
      }
      glow(c, x, y, s * .14, '190,220,255', .9);
      glow(c, x, y, s * .04, '255,255,255', 1);
      break;
    }
    case 'milkyway':
      drawSpiral(c, x, y, s * .46, {seed:7, arms:4, rot:t * .05});
      break;
    case 'blackhole':
      drawBlackHole(c, x, y, s * .15, t);
      break;
    case 'blackhole2': {
      drawStarBall(c, x + s * .27, y - s * .2, s * .12, '#ffffff', '#8fb6ff', '150,190,255', true);
      c.strokeStyle = 'rgba(160,200,255,.6)'; c.lineWidth = s * .03; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x + s * .17, y - s * .15); c.quadraticCurveTo(x + s * .05, y - s * .05, x - s * .02, y + s * .02); c.stroke();
      drawBlackHole(c, x - s * .1, y + s * .08, s * .09, t);
      break;
    }
    case 'pulsar': {
      c.save(); c.translate(x, y); c.rotate(t * 2.5);
      for (const k of [-1, 1]) {
        const g = c.createLinearGradient(0, 0, 0, k * s * .48);
        g.addColorStop(0, 'rgba(200,230,255,.9)'); g.addColorStop(1, 'rgba(120,180,255,0)');
        c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.lineTo(-s * .09, k * s * .48); c.lineTo(s * .09, k * s * .48); c.closePath(); c.fill();
      }
      c.restore();
      drawStarBall(c, x, y, s * .1, '#ffffff', '#a8d2ff', '170,210,255', true);
      break;
    }
    case 'localgroup':
      drawSpiral(c, x - s * .2, y + s * .14, s * .16, {seed:7, arms:4});
      drawSpiral(c, x + s * .18, y - s * .14, s * .22, {seed:11, squash:.4, angle:-.6, core:'255,215,180'});
      drawSpiral(c, x + s * .26, y + s * .22, s * .08, {seed:5, color:'170,200,255'});
      break;
    case 'andromeda':
      drawSpiral(c, x, y, s * .46, {seed:11, squash:.38, angle:-.6, core:'255,215,180', rot:t * .03});
      break;
    case 'triangulum':
      drawSpiral(c, x, y, s * .4, {seed:5, color:'170,200,255', rot:t * .04});
      break;
    case 'lmc':
      drawBlob(c, x, y, s * .36, 33, '200,215,255');
      glow(c, x - s * .05, y, s * .12, '255,230,190', .5);
      break;
    case 'virgosc':
      drawGalaxyCloud(c, x - s * .18, y + s * .12, s * .16, 3, 14);
      drawGalaxyCloud(c, x + s * .14, y - s * .1, s * .24, 9, 26);
      drawGalaxyCloud(c, x + s * .2, y + s * .26, s * .1, 4, 8);
      break;
    case 'cluster':
      drawGalaxyCloud(c, x, y, s * .4, 21, 40);
      break;
    case 'm87': {
      const g = c.createRadialGradient(x, y, s * .12, x, y, s * .36);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.3, 'rgba(255,110,30,.95)'); g.addColorStop(.55, 'rgba(255,190,90,.9)'); g.addColorStop(1, 'rgba(120,30,0,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, s * .36, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,235,150,.6)'; c.lineWidth = s * .05;
      c.beginPath(); c.arc(x, y, s * .21, .1 * Math.PI, .9 * Math.PI); c.stroke();
      break;
    }
    case 'laniakea':
      drawFlow(c, x, y, s * .44, x + s * .05, y - s * .03, t);
      break;
    case 'attractor':
      drawFlow(c, x, y, s * .44, x, y, t);
      glow(c, x, y, s * .08, '255,255,255', 1);
      break;
    case 'universe': {
      c.save(); c.beginPath(); c.arc(x, y, s * .44, 0, TAU); c.clip();
      c.fillStyle = '#0b0730'; c.fillRect(x - s / 2, y - s / 2, s, s);
      drawWeb(c, x, y, s * .44, 77, 40);
      c.restore();
      c.strokeStyle = 'rgba(255,150,90,.7)'; c.lineWidth = s * .03; c.beginPath(); c.arc(x, y, s * .44, 0, TAU); c.stroke();
      break;
    }
    case 'web':
      drawWeb(c, x, y, s * .44, 13, 40);
      break;
    case 'bigbang': {
      const g = c.createRadialGradient(x, y, 0, x, y, s * .46);
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.2, 'rgba(255,240,150,.95)'); g.addColorStop(.45, 'rgba(255,140,60,.7)'); g.addColorStop(.75, 'rgba(160,60,200,.4)'); g.addColorStop(1, 'rgba(60,20,120,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, s * .46, 0, TAU); c.fill();
      c.save(); c.translate(x, y); c.rotate(t * .2); c.strokeStyle = 'rgba(255,240,200,.5)'; c.lineCap = 'round';
      for (let i = 0; i < 16; i++) { c.lineWidth = i % 2 ? 1.5 : 3; c.rotate(TAU / 16); c.beginPath(); c.moveTo(s * .12, 0); c.lineTo(s * (i % 2 ? .3 : .42), 0); c.stroke(); }
      c.restore();
      break;
    }
  }
  c.restore();
}

function artR(id, s) { return id === 'saturn' ? s * .24 : id === 'sun' ? s * .3 : id === 'uranus' ? s * .34 : s * .4; }
function planetCanvas(id, size, face = true) {
  const c = document.createElement('canvas'), d = dprOf();
  c.width = c.height = Math.round(size * d);
  const x = c.getContext('2d'); x.scale(d, d);
  if (WONDERS[id]) drawWonder(x, WONDERS[id].art, size / 2, size / 2, size, 0);
  else drawPlanet(x, id, size / 2, size / 2, artR(id, size), {face});
  return c;
}
function localPt(el, e) {
  const r = el.getBoundingClientRect();
  return {x:e.clientX - r.left - el.clientLeft, y:e.clientY - r.top - el.clientTop};
}
function fitCanvas(c) {
  const d = dprOf(), w = c.clientWidth || 1, h = c.clientHeight || 1;
  if (c.width !== Math.round(w * d) || c.height !== Math.round(h * d)) { c.width = Math.round(w * d); c.height = Math.round(h * d); }
  const ctx = c.getContext('2d'); ctx.setTransform(d, 0, 0, d, 0, 0);
  return {ctx, w, h};
}

/* ---------- 背景星空 ---------- */
const sky = $('#sky');
let skyStars = [], shooting = null;
function sizeSky() {
  const {w, h} = fitCanvas(sky);
  skyStars = Array.from({length: Math.round(w * h / 4500)}, () => ({x:Math.random() * w, y:Math.random() * h, r:Math.random() * 1.5 + .4, p:Math.random() * TAU, s:.6 + Math.random() * 1.6}));
}
function drawSky(t, dt) {
  const {ctx, w, h} = fitCanvas(sky);
  ctx.fillStyle = '#0a0d2b'; ctx.fillRect(0, 0, w, h);
  const n1 = ctx.createRadialGradient(w * .15, h * .2, 0, w * .15, h * .2, Math.max(w, h) * .55);
  n1.addColorStop(0, 'rgba(120,70,200,.28)'); n1.addColorStop(1, 'rgba(120,70,200,0)');
  ctx.fillStyle = n1; ctx.fillRect(0, 0, w, h);
  const n2 = ctx.createRadialGradient(w * .9, h * .85, 0, w * .9, h * .85, Math.max(w, h) * .5);
  n2.addColorStop(0, 'rgba(40,170,190,.2)'); n2.addColorStop(1, 'rgba(40,170,190,0)');
  ctx.fillStyle = n2; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff';
  for (const s of skyStars) {
    ctx.globalAlpha = reduceMotion ? .7 : .35 + .65 * (.5 + .5 * Math.sin(t * s.s + s.p));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (reduceMotion) return;
  if (!shooting && Math.random() < dt * .25) shooting = {x:Math.random() * w * .7, y:Math.random() * h * .4, life:1};
  if (shooting) {
    shooting.x += 520 * dt; shooting.y += 260 * dt; shooting.life -= dt * 1.4;
    const g = ctx.createLinearGradient(shooting.x, shooting.y, shooting.x - 90, shooting.y - 45);
    g.addColorStop(0, `rgba(255,255,255,${Math.max(0, shooting.life)})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(shooting.x, shooting.y); ctx.lineTo(shooting.x - 90, shooting.y - 45); ctx.stroke();
    if (shooting.life <= 0) shooting = null;
  }
}

/* ---------- 彩带特效 ---------- */
const fx = $('#fx');
let fxParts = [];
function confetti(n = 90, x, y) {
  if (reduceMotion) return;
  x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
  const cols = ['#ffc53d','#3fe0b5','#7cc0ff','#ff9fc4','#ff6b57'];
  for (let i = 0; i < n; i++) fxParts.push({x, y, vx:(Math.random() - .5) * 700, vy:-Math.random() * 600 - 150, life:1.4 + Math.random(), c:cols[i % cols.length], s:5 + Math.random() * 6, rot:Math.random() * 6, vr:(Math.random() - .5) * 12, star:Math.random() < .35});
}
function drawFX(dt) {
  const {ctx, w, h} = fitCanvas(fx);
  ctx.clearRect(0, 0, w, h);
  if (!fxParts.length) return;
  for (const p of fxParts) {
    p.vy += 900 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
    ctx.globalAlpha = Math.min(1, p.life * 2);
    if (p.star) drawStar(ctx, p.x, p.y, p.s, p.rot);
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
  fxParts = fxParts.filter(p => p.life > 0 && p.y < h + 40);
}

const toastQ = [];

}

const START_ANG = {mercury:.6, venus:2.4, earth:4.2, mars:5.4, jupiter:1.2, saturn:3.1, uranus:5.0, neptune:.2};
const BELT = [655, 760];
const ACC = 900, MAXV = 430;
const KEYS = new Set();
const EX = {
  inited:false, t:0, paused:false, w:0, h:0, zoom:1, cam:{x:0, y:0}, collected:0, hinted:false,
  rocket:{x:0, y:0, vx:0, vy:0, a:0, inv:0}, keys:KEYS, pointer:null, thrust:false, moved:false,
  stars:[], rocks:[], parts:[], floats:[], bg:[], ignore:null, shake:0
};
const exCanvas = $('#exCanvas');
function bodyPos(p, t) {
  if (p.id === 'sun') return {x:0, y:0};
  const o = ORBIT[p.id], w = .05 * Math.pow(240 / o, 1.5), a = START_ANG[p.id] + w * t;
  return {x:Math.cos(a) * o, y:Math.sin(a) * o};
}
function randStar() {
  for (;;) {
    const r = 170 + Math.random() * (WORLD_R - 220), a = Math.random() * TAU;
    if (r > BELT[0] - 20 && r < BELT[1] + 20) continue;
    return {x:Math.cos(a) * r, y:Math.sin(a) * r, spin:Math.random() * 6};
  }
}
function exInit() {
  EX.inited = true;
  EX.stars = Array.from({length:70}, randStar);
  EX.rocks = Array.from({length:34}, () => {
    const size = 9 + Math.random() * 13, n = 7;
    return {rad:BELT[0] + Math.random() * (BELT[1] - BELT[0]), ang:Math.random() * TAU, w:.03 + Math.random() * .04,
      size, rot:Math.random() * 6, vr:(Math.random() - .5) * 1.5, x:0, y:0,
      verts:Array.from({length:n}, (_, i) => ({a:i / n * TAU, r:.75 + Math.random() * .35}))};
  });
  const e = bodyPos(BY.earth, 0), d = Math.hypot(e.x, e.y);
  EX.rocket.x = e.x + e.x / d * 80; EX.rocket.y = e.y + e.y / d * 80; EX.rocket.a = Math.atan2(e.y, e.x);
  EX.cam.x = EX.rocket.x; EX.cam.y = EX.rocket.y;
}
function exResize() {
  const {w, h} = fitCanvas(exCanvas);
  EX.w = w; EX.h = h;
  EX.zoom = Math.max(.55, Math.min(1, Math.min(w, h) / 720));
  EX.bg = Array.from({length:Math.round(w * h / 3500)}, () => ({x:Math.random() * w, y:Math.random() * h, r:Math.random() < .2 ? 2 : 1.2, a:.3 + Math.random() * .6, p:.05 + Math.random() * .25}));
}
function startExplore() {
  if (!EX.inited) exInit();
  exResize();
  EX.paused = false; EX.keys.clear(); EX.pointer = null;
  $('#exHint').style.opacity = 1; EX.moved = false;
  renderMission();
  const m = MISSIONS[save.mission];
  setTimeout(() => say(m ? '任务：' + m.text : '自由探索时间！'), 300);
}
function renderMission() {
  const m = MISSIONS[save.mission];
  if (!m) {
    $('#mNum').textContent = '完成';
    $('#mText').textContent = save.stickers.length < PLANETS.length ? '任务全部完成！跟着箭头去找剩下的贴纸吧' : '你已经是探险高手啦，自由飞行吧！';
    $('#mHint').hidden = true; $('#mHintText').hidden = true;
    return;
  }
  $('#mNum').textContent = `任务 ${save.mission + 1}/${MISSIONS.length}`;
  $('#mText').textContent = m.text + (m.type === 'collect' ? `（${EX.collected}/${m.n}）` : '');
  $('#mHint').hidden = EX.hinted;
  $('#mHintText').hidden = !EX.hinted;
  $('#mHintText').textContent = m.hint;
}
$('#mHint').addEventListener('click', () => {
  EX.hinted = true; renderMission(); SFX.click();
  const m = MISSIONS[save.mission]; if (m) say(m.hint);
});
function completeMission() {
  save.mission++; EX.hinted = false; EX.collected = 0;
  addStars(3); SFX.good(); confetti(60);
  const next = MISSIONS[save.mission];
  if (next) {
    toast(`任务完成！+3 ★ 下一个：${next.text}`, 3200);
    setTimeout(() => say('任务完成！下一个任务：' + next.text), 700);
  } else {
    toast('12 个任务全部完成！你是任务达人！', 3600);
    say('太厉害了！所有任务都完成啦！');
  }
  renderMission();
}
function missionLanded(id) {
  const m = MISSIONS[save.mission];
  if (!m || m.type !== 'visit') return;
  if (m.id === id) completeMission();
  else toast(`这是${BY[id].name}。任务要找的是另一颗哦`);
}
function floatText(x, y, text, color) { EX.floats.push({x, y, text, color, life:1.1}); }
function angLerp(a, b, k) { let d = wrap(b - a + Math.PI, TAU) - Math.PI; return a + d * k; }

function land(p, nx, ny) {
  const E = EX, r = E.rocket;
  E.paused = true; E.pointer = null; E.keys.clear(); E.thrust = false;
  r.vx = r.vy = 0;
  openCard(p.id, true).then(() => {
    const R = SIZE[p.id];
    E.ignore = p.id; E.paused = false;
    r.x = p.x + nx * (R + 30); r.y = p.y + ny * (R + 30);
    r.vx = nx * 240; r.vy = ny * 240; r.a = Math.atan2(ny, nx);
    missionLanded(p.id);
  });
}

function exStep(dt) {
  const E = EX, r = E.rocket;
  for (const p of PLANETS) { const q = bodyPos(p, E.t); p.x = q.x; p.y = q.y; }
  if (!E.paused) {
    E.t += dt;
    let ix = 0, iy = 0;
    const k = E.keys;
    if (k.has('ArrowLeft') || k.has('KeyA')) ix--;
    if (k.has('ArrowRight') || k.has('KeyD')) ix++;
    if (k.has('ArrowUp') || k.has('KeyW')) iy--;
    if (k.has('ArrowDown') || k.has('KeyS')) iy++;
    if (E.pointer) {
      const wx = E.cam.x + (E.pointer.x - E.w / 2) / E.zoom, wy = E.cam.y + (E.pointer.y - E.h / 2) / E.zoom;
      const dx = wx - r.x, dy = wy - r.y, d = Math.hypot(dx, dy);
      if (d > 22) { ix = dx / d; iy = dy / d; }
    }
    const m = Math.hypot(ix, iy);
    E.thrust = m > 0;
    if (m > 0) {
      r.vx += ix / m * ACC * dt; r.vy += iy / m * ACC * dt;
      if (!E.moved) { E.moved = true; setTimeout(() => { $('#exHint').style.opacity = 0; }, 2500); }
    }
    const drag = Math.exp(-1.5 * dt); r.vx *= drag; r.vy *= drag;
    const sp = Math.hypot(r.vx, r.vy);
    if (sp > MAXV) { r.vx *= MAXV / sp; r.vy *= MAXV / sp; }
    r.x += r.vx * dt; r.y += r.vy * dt;
    if (sp > 15) r.a = angLerp(r.a, Math.atan2(r.vy, r.vx), 1 - Math.exp(-8 * dt));
    const dc = Math.hypot(r.x, r.y);
    if (dc > WORLD_R) {
      const nx = r.x / dc, ny = r.y / dc, vn = r.vx * nx + r.vy * ny;
      r.x = nx * WORLD_R; r.y = ny * WORLD_R;
      if (vn > 0) { r.vx -= vn * nx * 1.6; r.vy -= vn * ny * 1.6; }
      if (!E.edgeTold) { E.edgeTold = true; floatText(r.x, r.y - 40, '前面就是太阳系的边缘啦', '#7cc0ff'); }
    }
    if (r.inv > 0) r.inv -= dt;

    if (E.thrust && !reduceMotion) {
      for (let i = 0; i < 2; i++) {
        const c = Math.cos(r.a), s = Math.sin(r.a);
        E.parts.push({x:r.x - c * 22, y:r.y - s * 22, vx:-c * 140 + (Math.random() - .5) * 70, vy:-s * 140 + (Math.random() - .5) * 70, life:.45, max:.45, c:Math.random() < .5 ? '#ffb03a' : '#fff2a8', s:3 + Math.random() * 3});
      }
    }

    for (const s of E.stars) {
      s.spin += dt * 2;
      if (Math.hypot(s.x - r.x, s.y - r.y) < 32) {
        addStars(1); SFX.star(); floatText(s.x, s.y, '+1 ★', '#ffd54a');
        Object.assign(s, randStar());
        const m = MISSIONS[save.mission];
        if (m && m.type === 'collect') { EX.collected++; if (EX.collected >= m.n) completeMission(); else renderMission(); }
      }
    }

    for (const a of E.rocks) {
      a.ang += a.w * dt; a.rot += a.vr * dt;
      a.x = Math.cos(a.ang) * a.rad; a.y = Math.sin(a.ang) * a.rad;
      if (r.inv <= 0) {
        const dx = r.x - a.x, dy = r.y - a.y, d = Math.hypot(dx, dy) || 1;
        if (d < a.size + 14) {
          r.vx = dx / d * 320; r.vy = dy / d * 320; r.inv = 1.2; E.shake = .3;
          SFX.bump();
          if (save.stars > 0) { addStars(-1); floatText(r.x, r.y - 30, '咚！-1 ★', '#ff7a8a'); }
          else floatText(r.x, r.y - 30, '咚！小心石头', '#ff7a8a');
        }
      }
    }

    for (const p of PLANETS) {
      const R = SIZE[p.id], dx = r.x - p.x, dy = r.y - p.y, d = Math.hypot(dx, dy) || 1;
      if (E.ignore === p.id) {
        if (d > R + 110) E.ignore = null;
        else if (d < R + 14) { r.x = p.x + dx / d * (R + 14); r.y = p.y + dy / d * (R + 14); }
        continue;
      }
      if (d < R + 14) { land(p, dx / d, dy / d); break; }
    }

    for (const p of E.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    E.parts = E.parts.filter(p => p.life > 0);
    for (const f of E.floats) { f.y -= 40 * dt; f.life -= dt; }
    E.floats = E.floats.filter(f => f.life > 0);
  }
  const tx = r.x + r.vx * .35, ty = r.y + r.vy * .35, ck = 1 - Math.exp(-4 * dt);
  E.cam.x += (tx - E.cam.x) * ck; E.cam.y += (ty - E.cam.y) * ck;
  E.shake = Math.max(0, E.shake - dt);
  exDraw();
}

function exDraw() {
  const E = EX, {ctx: c, w, h} = fitCanvas(exCanvas), r = E.rocket, z = E.zoom;
  c.fillStyle = '#070a24'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#fff';
  for (const s of E.bg) {
    c.globalAlpha = s.a;
    c.fillRect(wrap(s.x - E.cam.x * s.p, w), wrap(s.y - E.cam.y * s.p, h), s.r, s.r);
  }
  c.globalAlpha = 1;

  const sh = E.shake > 0 && !reduceMotion ? E.shake * 30 : 0;
  c.save();
  c.translate(w / 2 + (Math.random() - .5) * sh, h / 2 + (Math.random() - .5) * sh);
  c.scale(z, z); c.translate(-E.cam.x, -E.cam.y);
  const vx0 = E.cam.x - w / 2 / z - 80, vx1 = E.cam.x + w / 2 / z + 80, vy0 = E.cam.y - h / 2 / z - 80, vy1 = E.cam.y + h / 2 / z + 80;
  const inView = (x, y, pad = 0) => x > vx0 - pad && x < vx1 + pad && y > vy0 - pad && y < vy1 + pad;

  c.strokeStyle = 'rgba(170,185,255,.16)'; c.lineWidth = 2 / z; c.setLineDash([8 / z, 12 / z]);
  for (const id of ORDER) { c.beginPath(); c.arc(0, 0, ORBIT[id], 0, TAU); c.stroke(); }
  c.setLineDash([]);
  c.strokeStyle = 'rgba(190,160,120,.07)'; c.lineWidth = BELT[1] - BELT[0];
  c.beginPath(); c.arc(0, 0, (BELT[0] + BELT[1]) / 2, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(160,200,255,.12)'; c.lineWidth = 6 / z;
  c.beginPath(); c.arc(0, 0, WORLD_R + 20, 0, TAU); c.stroke();

  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `700 ${14 / z}px ${FONT}`; c.fillStyle = 'rgba(230,205,170,.55)';
  for (let k = 0; k < 6; k++) {
    const a = k * TAU / 6 + .5, R = (BELT[0] + BELT[1]) / 2;
    if (inView(Math.cos(a) * R, Math.sin(a) * R)) c.fillText('小行星带', Math.cos(a) * R, Math.sin(a) * R);
  }

  for (const s of E.stars) if (inView(s.x, s.y)) drawStar(c, s.x, s.y, 12, s.spin);

  for (const a of E.rocks) {
    if (!inView(a.x, a.y)) continue;
    drawRock(c, a.x, a.y, a.size, a.rot, a.verts);
  }

  PLANETS.forEach((p, i) => {
    const R = SIZE[p.id];
    if (!inView(p.x, p.y, R * 2)) return;
    drawPlanet(c, p.id, p.x, p.y, R, {face:true, rot:E.t * .05, blink:((E.t + i * 1.3) % 4) < .14});
    const ly = p.y + R + (p.id === 'saturn' ? 22 : p.id === 'sun' ? 40 : 8) + 14 / z;
    c.font = `900 ${16 / z}px ${FONT}`;
    const label = p.name + (save.stickers.includes(p.id) ? ' ✓' : '');
    c.lineWidth = 4 / z; c.strokeStyle = 'rgba(7,10,36,.85)'; c.strokeText(label, p.x, ly);
    c.fillStyle = save.stickers.includes(p.id) ? '#3fe0b5' : '#f5f2ff'; c.fillText(label, p.x, ly);
  });

  for (const p of E.parts) { c.globalAlpha = p.life / p.max; c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.s * (p.life / p.max), 0, TAU); c.fill(); }
  c.globalAlpha = 1;

  if (!(r.inv > 0 && Math.floor(r.inv * 12) % 2)) drawRocket(c, r.x, r.y, r.a, 1.5, E.thrust ? 1 : 0);

  for (const f of E.floats) {
    c.globalAlpha = Math.min(1, f.life * 2);
    c.font = `900 ${18 / z}px ${FONT}`;
    c.lineWidth = 4 / z; c.strokeStyle = 'rgba(7,10,36,.9)'; c.strokeText(f.text, f.x, f.y);
    c.fillStyle = f.color; c.fillText(f.text, f.x, f.y);
  }
  c.globalAlpha = 1;
  c.restore();

  drawNav(c, w, h);
  drawMini(c, w, h);
}

function navTarget() {
  const m = MISSIONS[save.mission];
  if (m) return m.type === 'visit' && EX.hinted ? BY[m.id] : null;
  let target = null, best = Infinity;
  for (const p of PLANETS) {
    if (save.stickers.includes(p.id)) continue;
    const d = Math.hypot(p.x - EX.rocket.x, p.y - EX.rocket.y);
    if (d < best) { best = d; target = p; }
  }
  return target;
}
function drawMini(c, w, h) {
  const E = EX, R = Math.min(64, Math.min(w, h) * .14), cx = w - R - 20, cy = h - R - 20, k = R / WORLD_R, tg = navTarget();
  c.save();
  c.fillStyle = 'rgba(20,26,78,.88)'; c.strokeStyle = '#3a4596'; c.lineWidth = 2;
  c.beginPath(); c.arc(cx, cy, R + 6, 0, TAU); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(170,185,255,.22)'; c.lineWidth = 1;
  for (const id of ORDER) { c.beginPath(); c.arc(cx, cy, ORBIT[id] * k, 0, TAU); c.stroke(); }
  for (const p of PLANETS) {
    const x = cx + p.x * k, y = cy + p.y * k;
    c.fillStyle = BASE[p.id][1]; c.beginPath(); c.arc(x, y, p.id === 'sun' ? 4.5 : Math.max(2, SIZE[p.id] * k * 3), 0, TAU); c.fill();
    if (p === tg) { c.strokeStyle = '#ffc53d'; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 6 + Math.sin(E.t * 5) * 1.5, 0, TAU); c.stroke(); }
  }
  c.fillStyle = '#fff'; c.beginPath(); c.arc(cx + E.rocket.x * k, cy + E.rocket.y * k, 3, 0, TAU); c.fill();
  c.restore();
}
function drawNav(c, w, h) {
  const E = EX, z = E.zoom, target = navTarget();
  if (!target) return;
  const sx = (target.x - E.cam.x) * z + w / 2, sy = (target.y - E.cam.y) * z + h / 2;
  const m = 56, top = 140;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (sx > m && sx < w - m && sy > top && sy < h - m) {
    const R = SIZE[target.id] * z + 14 + Math.sin(E.t * 4) * 3;
    c.strokeStyle = 'rgba(255,197,61,.85)'; c.lineWidth = 3; c.setLineDash([8, 8]);
    c.beginPath(); c.arc(sx, sy, R, 0, TAU); c.stroke(); c.setLineDash([]);
    return;
  }
  const cx = w / 2, cy = (h + top) / 2;
  const dx = sx - cx, dy = sy - cy;
  const hw = w / 2 - m, hh = (h - top) / 2 - m;
  const s = Math.min(hw / Math.abs(dx || 1e-6), hh / Math.abs(dy || 1e-6));
  const ax = cx + dx * s, ay = cy + dy * s, ang = Math.atan2(dy, dx);
  c.save();
  c.fillStyle = 'rgba(28,35,99,.92)'; c.strokeStyle = '#ffc53d'; c.lineWidth = 3;
  c.beginPath(); c.arc(ax, ay, 30, 0, TAU); c.fill(); c.stroke();
  c.translate(ax, ay); c.rotate(ang);
  c.fillStyle = '#ffc53d'; c.beginPath(); c.moveTo(44, 0); c.lineTo(32, -9); c.lineTo(32, 9); c.closePath(); c.fill();
  c.restore();
  drawPlanet(c, target.id, ax, ay, target.id === 'saturn' ? 11 : target.id === 'sun' ? 13 : 17, {});
  c.font = `900 14px ${FONT}`;
  const ty = ay + (ay > h / 2 ? -46 : 46);
  c.lineWidth = 4; c.strokeStyle = 'rgba(7,10,36,.9)'; c.strokeText('去' + target.name, ax, ty);
  c.fillStyle = '#ffc53d'; c.fillText('去' + target.name, ax, ty);
}

exCanvas.addEventListener('pointerdown', e => {
  if (EX.paused) return;
  try { exCanvas.setPointerCapture(e.pointerId); } catch (err) {}
  EX.pointer = localPt(exCanvas, e); audio();
});
exCanvas.addEventListener('pointermove', e => { if (EX.pointer) EX.pointer = localPt(exCanvas, e); });
['pointerup','pointercancel','lostpointercapture'].forEach(n => exCanvas.addEventListener(n, () => { EX.pointer = null; }));
const DRIVE_KEYS = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'];
window.addEventListener('keydown', e => {
  if (card && (e.key === 'Escape')) { closeCard(); return; }
  const driving = (current === 'explore' && !EX.paused) || (current === 'arcade' && ARC.phase === 'fly');
  if (driving && DRIVE_KEYS.includes(e.code)) { KEYS.add(e.code); e.preventDefault(); audio(); }
});
window.addEventListener('keyup', e => KEYS.delete(e.code));
window.addEventListener('blur', () => { KEYS.clear(); EX.pointer = null; ARC.pointer = null; });

/* ---------- 问答 ---------- */
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const QZ = {lv:0, list:[], i:0, score:0, marks:[]};
const quizUnlocked = i => i === 0 || (save.quizBest[i - 1] || 0) >= 5 || (i === 3 && cosUnlocked(STAGES.length - 1));
function quizPick() {
  $('#quizPick').hidden = false; $('#quizPlay').hidden = true; $('#quizEnd').hidden = true;
  $('#barTitle').textContent = TITLES.quiz;
  const box = $('#quizLevels'); box.innerHTML = '';
  QUIZ_LEVELS.forEach((L, i) => {
    const open = quizUnlocked(i), best = save.quizBest[i] || 0;
    const b = document.createElement('button'); b.className = 'lvl'; b.disabled = !open;
    b.appendChild(planetCanvas(L.icon, 56, open));
    const t = document.createElement('b'); t.textContent = L.name;
    const s = document.createElement('small');
    s.textContent = open ? L.desc : (i === 3 ? '通过第 3 关，或走完宇宙大旅行' : '上一关答对 5 题就能打开');
    const r = document.createElement('span'); r.className = 'rate';
    r.textContent = open ? (best ? `最好 ${best}/8` : '还没玩过') : '未解锁';
    b.append(t, s, r);
    b.addEventListener('click', () => { SFX.click(); startQuiz(i); });
    box.appendChild(b);
  });
}
function startQuiz(lv) {
  QZ.lv = lv; QZ.list = shuffle(QUIZ_LEVELS[lv].qs.slice()).slice(0, 8); QZ.i = 0; QZ.score = 0; QZ.marks = [];
  $('#quizPick').hidden = true; $('#quizPlay').hidden = false; $('#quizEnd').hidden = true;
  $('#barTitle').textContent = `星球问答 · ${QUIZ_LEVELS[lv].name}`;
  renderQ();
}
function renderDots() {
  $('#quizDots').innerHTML = QZ.list.map((_, i) => `<i class="${QZ.marks[i] || (i === QZ.i ? 'on' : '')}"></i>`).join('');
}
function renderQ() {
  const it = QZ.list[QZ.i];
  renderDots();
  $('#quizQ').textContent = it.q;
  const box = $('#quizOpts'); box.innerHTML = '';
  shuffle(it.opts.slice()).forEach(o => {
    const b = document.createElement('button'); b.className = 'opt'; b.dataset.v = o;
    const info = infoOf(o);
    if (info) { b.appendChild(planetCanvas(o, 72)); b.append(info.name); }
    else b.textContent = o;
    b.addEventListener('click', () => answer(b, o));
    box.appendChild(b);
  });
  $('#quizFb').hidden = true; $('#quizNext').hidden = true;
  say(it.q);
}
function answer(btn, o) {
  const it = QZ.list[QZ.i], ok = o === it.a;
  document.querySelectorAll('#quizOpts .opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === it.a) b.classList.add('right');
    else if (b !== btn) b.classList.add('dim');
  });
  const fb = $('#quizFb');
  if (ok) { QZ.score++; addStars(2); SFX.good(); fb.className = 'feedback ok'; fb.innerHTML = '<b>答对啦！+2 ★</b>'; confetti(30, btn.getBoundingClientRect().left + btn.offsetWidth / 2, btn.getBoundingClientRect().top); }
  else { btn.classList.add('wrong'); SFX.bad(); fb.className = 'feedback no'; fb.innerHTML = '<b>差一点点！</b>'; }

const CS = {lv:0, step:0, done:false, bg:[], labels:{}};

    b.disabled = !consUnlocked(i);

  if (id === 'cosmos') startCosmos();
  if (id === 'explore') startExplore();
  if (id === 'arcade') arcShowSelect();
  if (id === 'quiz') quizPick();
  if (id === 'order') startOrder();
  if (id === 'cons') startCons(firstCons());
  if (id === 'book') renderBook();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (t) { audio(); SFX.click(); go(t.dataset.go); }
});
$('#backBtn').addEventListener('click', () => { SFX.click(); if (card) closeCard(); go('home'); });

/* ---------- 主循环 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000;
  last = now;
  if (current === 'explore') exStep(dt);
  else if (current === 'arcade' && ARC.phase !== 'idle') arcStep(dt);
  else drawSky(t, dt);
  if (current === 'home') drawHero(t);
  if (current === 'cosmos') drawCosmos(t);
  if (current === 'cons') drawCons(t);
  if (card) drawCardArt(t);
  drawFX(dt);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  sizeSky();
  if (current === 'explore') exResize();
  if (current === 'arcade' && ARC.phase !== 'idle') {
    arcResize();
    const r = ARC.rocket; r.tx = r.x = clamp(r.x, 24, ARC.w - 24); r.ty = r.y = clamp(r.y, ARC.h * .4, ARC.h - 48);
  }
  if (current === 'home') drawModeIcons();
});
renderSoundBtn();
refreshCounts();
sizeSky();
go('home');
checkBadges();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (current === 'home') drawModeIcons(); });
requestAnimationFrame(frame);
})();
</script>
</html>
