<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>汉字积木</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect x=%225%22 y=%225%22 width=%2290%22 height=%2290%22 rx=%2220%22 fill=%22%23ffd35e%22/%3E%3Ctext x=%2250%22 y=%2272%22 font-size=%2266%22 text-anchor=%22middle%22%3E明%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="title" class="screen active">
  <div class="title-card">
    <div class="title-blocks" aria-hidden="true"><span>日</span><span>月</span><i>→</i><b>明</b></div>
    <h1>汉字积木</h1>
    <p class="title-sub">部件方块掉下来，找到好朋友拼成字</p>
    <button id="start" class="big-btn">开始拼字 ▶</button>
    <div class="grade-pick" role="group" aria-label="选择年级">
      <span>我上</span>
      <div id="grades"></div>
    </div>
    <div class="title-links">
      <button id="open-book" class="link-btn">📖 汉字图鉴</button>
      <button id="open-credits" class="link-btn">ℹ️ 关于</button>
    </div>
  </div>
</section>

<section id="map" class="screen">
  <header class="bar">
    <button class="icon-btn" data-go="title" aria-label="返回">←</button>
    <h2 id="world-title">日月明小镇</h2>
    <span class="coins">🪙 <b id="map-coins">0</b></span>
  </header>
  <div id="levels" class="level-path"></div>
</section>

<section id="play" class="screen">
  <canvas id="canvas" aria-label="游戏画面：点一列，把方块放下去"></canvas>
  <div class="hud-btns">
    <button id="replay" class="icon-btn round" aria-label="再听一遍">🔊</button>
    <button id="pause" class="icon-btn round" aria-label="暂停">⏸</button>
  </div>
  <div id="intro" class="overlay">
    <div class="panel">
      <p class="level-no" id="intro-no">第 1 关</p>
      <h2 id="intro-name"></h2>
      <p id="intro-text"></p>
      <p class="keys">点一列，方块就落到那里；键盘 ← → 移动，↓ 或空格放下</p>
      <button id="go" class="big-btn">开始！</button>
    </div>
  </div>
  <div id="paused" class="overlay" hidden>
    <div class="panel">
      <h2>休息一下</h2>
      <button id="resume" class="big-btn">继续</button>
      <button id="restart" class="mid-btn">重新开始</button>
      <button class="mid-btn" data-go="map">回地图</button>
    </div>
  </div>
  <div id="result" class="overlay" hidden>
    <div class="panel">
      <h2 id="result-title"></h2>
      <p id="result-stars" class="stars"></p>
      <p id="result-text"></p>
      <button id="result-next" class="big-btn"></button>
      <button id="result-listen" class="mid-btn" hidden>🔊 再听听</button>
      <button id="result-again" class="mid-btn">再玩一次</button>
      <button id="result-skip" class="mid-btn" hidden>先跳过这关</button>
      <button class="mid-btn" data-go="map">回地图</button>
    </div>
  </div>
</section>

<section id="book" class="screen">
  <header class="bar">
    <button class="icon-btn" data-go="title" aria-label="返回">←</button>
    <h2>汉字图鉴</h2>
    <span class="coins" id="book-count"></span>
  </header>
  <p class="book-tip">拼出来的字会亮起来，点一点就能听。</p>
  <div id="cards" class="cards"></div>
</section>

<div id="credits" class="overlay" hidden>
  <div class="panel credits">
    <h2>关于</h2>
    <p>字音和组词是真人录音，来自开放数据项目
      <a href="https://github.com/hugolpz/audio-cmn" target="_blank" rel="noopener">audio-cmn</a>
      （录音：Yue Tan、Chen Wang，协议 CC BY-SA）。</p>
    <p>字表按统编版一年级写字表、识字表选字，部件拆分参考 cjkvi-ids，读音参考汉典。</p>
    <p>画面和玩法为本游戏原创。</p>
    <button id="close-credits" class="mid-btn">知道啦</button>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="js/chars.js"></script>
<script src="js/audio-list.js"></script>
<script src="js/board.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
