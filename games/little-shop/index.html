<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>小小店长</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🏪%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="title" class="screen active">
  <div class="title-card">
    <div class="title-shop" aria-hidden="true">🏪</div>
    <h1>小小店长</h1>
    <p class="title-sub">开一家小店：收钱、找零、看钟表</p>
    <button id="start" class="big-btn">开门营业 ▶</button>
    <div class="grade-pick" role="group" aria-label="选择年级">
      <span>我上</span>
      <div id="grades"></div>
    </div>
    <div class="title-links">
      <button id="open-decor" class="link-btn">🛠️ 装修小店</button>
      <button id="open-book" class="link-btn">📖 图鉴</button>
      <button id="open-credits" class="link-btn">ℹ️ 关于</button>
    </div>
  </div>
</section>

<section id="map" class="screen">
  <header class="bar">
    <button class="icon-btn" data-go="title" aria-label="返回">←</button>
    <h2 id="world-title">森林街角小店</h2>
    <span class="coins">🪙 <b id="map-coins">0</b></span>
  </header>
  <div id="levels" class="level-path"></div>
</section>

<section id="play" class="screen">
  <div id="stage" class="stage">
    <div class="hud">
      <div id="hud-info" class="hud-info"></div>
      <div class="day" aria-label="营业时间"><span>☀️</span><div class="day-bar"><i id="day-fill"></i></div><span>🌙</span></div>
      <button id="pause" class="icon-btn round" aria-label="暂停">⏸</button>
    </div>
    <div id="scene" class="scene">
      <div id="scene-bg"></div>
      <div id="cust-area"></div>
      <div id="pests"></div>
      <div id="fx"></div>
    </div>
    <div id="panel" class="panel"></div>
  </div>
  <div id="intro" class="overlay">
    <div class="panel-card">
      <p class="level-no" id="intro-no">第 1 关</p>
      <h2 id="intro-name"></h2>
      <p id="intro-text"></p>
      <button id="go" class="big-btn">开门！</button>
    </div>
  </div>
  <div id="paused" class="overlay" hidden>
    <div class="panel-card">
      <h2>休息一下</h2>
      <button id="resume" class="big-btn">继续营业</button>
      <button id="restart" class="mid-btn">重新开始</button>
      <button class="mid-btn" data-go="map">回地图</button>
    </div>
  </div>
  <div id="result" class="overlay" hidden>
    <div class="panel-card">
      <h2 id="result-title"></h2>
      <p id="result-stars" class="stars"></p>
      <p id="result-text"></p>
      <button id="result-next" class="big-btn"></button>
      <button id="result-again" class="mid-btn">再玩一次</button>
      <button id="result-skip" class="mid-btn" hidden>先跳过这关</button>
      <button class="mid-btn" data-go="map">回地图</button>
    </div>
  </div>
</section>

<section id="decor" class="screen">
  <header class="bar">
    <button class="icon-btn" data-go="title" aria-label="返回">←</button>
    <h2>装修小店</h2>
    <span class="coins">🪙 <b id="decor-coins">0</b></span>
  </header>
  <div class="decor-body">
    <div class="decor-preview"><div id="decor-scene" class="scene mini"></div></div>
    <div id="decor-list" class="decor-list"></div>
  </div>
</section>

<section id="book" class="screen">
  <header class="bar">
    <button class="icon-btn" data-go="title" aria-label="返回">←</button>
    <h2>图鉴</h2>
    <span class="coins" id="book-count"></span>
  </header>
  <div class="book-body">
    <h3>顾客朋友</h3>
    <div id="friend-cards" class="cards"></div>
    <h3>钱币宝宝</h3>
    <div id="money-cards" class="cards money-cards"></div>
  </div>
</section>

<div id="credits" class="overlay" hidden>
  <div class="panel-card credits">
    <h2>关于</h2>
    <p>画面、钱币、钟表和玩法都是本游戏原创。钱币只是"玩具钱"，没有照抄真钱的图案。</p>
    <p>小动物和货物用的是系统自带的表情符号。音效是浏览器现场合成的。</p>
    <button id="close-credits" class="mid-btn">知道啦</button>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="js/money.js"></script>
<script src="js/data.js"></script>
<script src="js/tasks.js"></script>
<script src="js/levels.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/view.js"></script>
<script src="js/main.js"></script>
</body>
</html>
