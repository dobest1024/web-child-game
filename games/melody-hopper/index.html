<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音符跳跃岛 - 音乐启蒙视唱小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top-bar">
    <a href="/" target="_top" class="back-link">‹ 返回大厅</a>
    <h1 class="game-title">音符跳跃岛 🐸</h1>
    <div class="stats">
      <span id="total-stars" class="stat-item">⭐ 0</span>
      <button id="mute-btn" class="icon-btn" aria-label="声音开关">🔊 声音</button>
    </div>
  </header>

  <main class="container">
    <!-- 关卡信息卡片 -->
    <section class="level-banner">
      <div class="level-header">
        <h2 id="level-name" class="level-name">第一课：下加一线的小矮人 C4</h2>
        <span id="level-mode" class="level-mode">视谱辨音</span>
      </div>
      <p id="level-desc" class="level-desc">对照五线谱与荷叶唱名，引导小青蛙踩下正确的音符！</p>
    </section>

    <!-- 舞台区：五线谱与小青蛙 -->
    <section class="stage-card">
      <div class="stave-wrapper">
        <canvas id="stave-canvas"></canvas>
      </div>

      <!-- 旋律步进指示 -->
      <div id="melody-progress" class="melody-progress"></div>

      <!-- 控制行 -->
      <div class="action-row">
        <button id="replay-sound-btn" class="replay-btn">
          <span>🔔 重新听音</span>
        </button>
        <select id="level-select" class="icon-btn" aria-label="选择关卡"></select>
      </div>
    </section>

    <!-- 荷塘键盘区 -->
    <section class="pond-keyboard">
      <div class="key-prompt">点击荷叶上的音符，小青蛙就会跃向对应位置：</div>
      <div id="lilypads-grid" class="lilypads-grid"></div>
    </section>
  </main>

  <!-- 通关结算弹窗 -->
  <div id="win-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-frog">🎉🐸🎶</div>
      <h3 class="modal-title">过关啦！</h3>
      <div id="modal-stars" class="stars-row">⭐⭐⭐</div>
      <p id="modal-msg" class="modal-msg">太棒啦！你在本关中展现了敏锐的小耳朵，顺利通过池塘！</p>
      <div class="modal-btns">
        <button id="retry-btn" class="secondary-btn">再练一次</button>
        <button id="next-level-btn" class="primary-btn">下一关</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
