<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>对称剪纸屋 · 轴对称窗花</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="back-link" href="/" target="_top" aria-label="返回游戏大厅">
      <span>←</span> 大厅
    </a>
    <h1>对称剪纸屋</h1>
    <button id="btn-levels">关卡 📋</button>
  </header>

  <div class="level-bar">
    <span id="level-info" style="font-weight:700">第 1 关</span>
    <span class="fold-indicator" id="fold-name">左右对折 📖</span>
  </div>

  <div class="workshop-area">
    <div class="panel-box">
      <div class="panel-title">✂️ 在折纸上剪切</div>
      <div class="cutting-grid" id="cutting-grid"></div>
    </div>

    <div class="panel-box">
      <div class="panel-title">🎯 目标窗花</div>
      <div class="preview-grid" id="target-grid"></div>
    </div>

    <div class="panel-box">
      <div class="panel-title">✨ 当前展开预览</div>
      <div class="preview-grid" id="preview-grid"></div>
    </div>
  </div>

  <div class="tip-box" id="tip-text">提示：在折纸上剪出形状，展开看看是不是对称窗花！</div>

  <div class="controls-row">
    <button id="btn-clear">清空 🧹</button>
    <button id="btn-check" class="primary">展开检验 展开 🎉</button>
  </div>

  <!-- Win Modal -->
  <dialog id="win-dialog">
    <h2 style="color:#e11d48">🌸 窗花大功告成！</h2>
    <p style="margin:14px 0; font-size:1.05rem; color:#475569">完美的轴对称窗花！收集进你的专属窗花册！⭐⭐⭐</p>
    <button id="btn-next" class="primary" style="padding:10px 24px; font-weight:800">下一关 ➔</button>
  </dialog>

  <!-- Level Select Modal -->
  <dialog id="levels-dialog">
    <h3>选择剪纸关卡</h3>
    <div class="level-grid" id="level-grid"></div>
    <button id="btn-close-levels">关闭</button>
  </dialog>

  <script type="module" src="game.js"></script>
</body>
</html>
